version: 2
updates:
  - package-ecosystem: npm
    cooldown:
      default-days: 3
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    cooldown:
      default-days: 3
    directory: "/"
    schedule:
      interval: weekly
