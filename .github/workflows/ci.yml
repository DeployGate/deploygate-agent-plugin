name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm test

  bundle-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run bundle

      # Release PRs only: the committed bundle is what plugin users run, so it
      # must match a fresh build. Elsewhere it is expected to lag behind main
      # between releases, because it is only regenerated on the release PR.
      # release.yml regenerates it only when release-please updates the PR, so
      # a bundle made stale by later non-release commits on main (e.g.
      # dependency bumps) has to be regenerated by hand; the steps are printed
      # below when the check fails.
      - name: Check that the committed bundle is up to date
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if ! git diff --exit-code --stat plugin/scripts/bundle.js; then
            echo "The committed bundle differs from a fresh build of this PR merged with main."
            echo "Regenerate it on the release PR branch:"
            echo ""
            echo "  git fetch origin"
            echo "  git switch -C ${BRANCH} origin/${BRANCH}"
            echo "  git merge origin/main"
            echo "  npm ci"
            echo "  npm run bundle"
            echo "  git add plugin/scripts/bundle.js"
            echo "  git commit --no-verify -m \"chore: regenerate bundle.js for release\""
            echo "  git push origin ${BRANCH}"
            echo ""
            echo "--no-verify is needed because the pre-commit hook blocks bundle commits outside the release workflow."
            echo "::error file=plugin/scripts/bundle.js::The committed bundle is stale. Regenerate it on the release PR branch; see the steps in this log."
            exit 1
          fi

      # Run the bundle on the exact minimum Node allowed by package.json
      # "engines". Copy plugin/ out of the checkout first, as the plugin cache
      # does, so neither node_modules nor the root package.json is visible.
      - uses: actions/setup-node@v7
        with:
          node-version: 20.0.0

      - run: |
          cp -R plugin "$RUNNER_TEMP/plugin"
          node scripts/smoke-bundle.mjs "$RUNNER_TEMP/plugin/scripts/bundle.js"
