name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm test

  bundle-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run bundle

      # Run the bundle on the minimum Node allowed by package.json "engines".
      # Copy it out of the checkout first so imports cannot resolve from
      # node_modules; published users get only the self-contained bundle.
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - run: |
          cp plugin/scripts/bundle.js "$RUNNER_TEMP/bundle.js"
          node scripts/smoke-bundle.mjs "$RUNNER_TEMP/bundle.js"
